<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板 · 大数字</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; top: 0; left: 0; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
/* =====================================================================
   模板 ④  ·  大数字 / KPI 卡
   ---------------------------------------------------------------------
   用途：年报、成绩单、KPI、里程碑。一个数字从 0 滚到目标值，
   配同比涨跌标签与进度条。改 CFG 即可。
   数字过长会自动缩字号（竖屏尤其需要），不会撑出画面。

   出片：
     bash ../render.sh number-counter.html --duration=7 --fps=60
     bash ../render.sh number-counter.html --duration=7 --fps=60 --width=1080 --height=1920
   ===================================================================== */
const CFG = {
  label:   '年度总营收',
  value:   128640,            // 目标数值
  unit:    '万元',
  prefix:  '¥',               // 数字前缀，不要就 ''
  decimals: 0,                // 小数位
  delta:   { text: '同比 +38.2%', up: true },   // 右上角涨跌标签；不需要就删掉这一行
  foot:    '示例数据 · 换成你自己的口径',
  barRatio: 0.78,             // 底部进度条填充比例 0..1（表达「完成度」）
  dur:     7.0,
  accent:  '#FFB86B',
  ink:     '#F4F7FC',
  bg:      '#080A10',
};
/* ===================================================================== */

/* ---------- 舞台：跟随视口 ---------- */
const cv = document.getElementById('stage');
const W = Math.max(1, Math.round(window.innerWidth));
const H = Math.max(1, Math.round(window.innerHeight));
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';

const DUR = CFG.dur;
/* 三档缩放：1920×1080 时 SX=SY=SF=1（与旧版逐像素一致） */
const SX = W / 1920, SY = H / 1080, SF = Math.sqrt(SX * SY);
const PORTRAIT = H > W;

const g = cv.getContext('2d');
const SANS = '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
/* 数字滚动要「先快后慢、末位稳」——纯 outExpo 会有一串眩目跳数，用 quintOut 更稳 */
const quintOut = t => 1 - Math.pow(1 - t, 5);

const fmt = v => v.toLocaleString('zh-CN', {
  minimumFractionDigits: CFG.decimals,
  maximumFractionDigits: CFG.decimals,
});

/* 数字区自动适配：按最终值（最长的一帧）量宽度，超了就整体缩字号 */
const MAXW = W * 0.84;
const NUM_BASE = 232 * SF, SMALL_BASE = 64 * SF;
const {
  k: FIT_K, numPx: NUM_PX, smallPx: SMALL_PX, preGap: PRE_GAP, unitGap: UNIT_GAP,
} = (() => {
  const full = fmt(CFG.value);
  g.save();
  g.font = `700 ${NUM_BASE}px ${MONO}`;
  const nw = g.measureText(full).width;
  g.font = `700 ${SMALL_BASE}px ${SANS}`;
  const uw = CFG.unit ? g.measureText(CFG.unit).width + 26 * SX : 0;
  const pw = CFG.prefix ? g.measureText(CFG.prefix).width + 20 * SX : 0;
  g.restore();
  const total = pw + nw + uw;
  const k = total > MAXW && total > 0 ? MAXW / total : 1;
  return {
    k,
    numPx: NUM_BASE * k,
    smallPx: SMALL_BASE * k,
    preGap: 20 * SX * k,
    unitGap: 26 * SX * k,
  };
})();

function drawFrame(T) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);

  /* 背景 + 中心暖光 */
  const bg = g.createLinearGradient(0, 0, W * 0.7, H);
  bg.addColorStop(0, CFG.bg);
  bg.addColorStop(1, '#0E1420');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
  const gxp = outCubic(win(T, 0, 1.2));
  const rad = g.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, 820 * SF);
  rad.addColorStop(0, `rgba(255,184,107,${0.13 * gxp})`);
  rad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rad;
  g.fillRect(0, 0, W, H);

  /* 环境光扫：一条极淡的光带缓慢横移 —— 「定格待读」的那几秒画面不会显得死 */
  const scx = (T / DUR * 1.6 - 0.3) * (W + 1200 * SX) - 600 * SX;
  const sweep = g.createLinearGradient(scx - 620 * SF, 0, scx + 620 * SF, H);
  sweep.addColorStop(0, 'rgba(255,255,255,0)');
  sweep.addColorStop(0.5, 'rgba(255,255,255,0.05)');
  sweep.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sweep;
  g.fillRect(0, 0, W, H);

  /* 上方标签 */
  const labP = outCubic(win(T, 0.15, 0.80));
  g.save();
  g.globalAlpha = labP * 0.7;
  g.fillStyle = CFG.ink;
  g.font = `500 ${38 * SF}px ${SANS}`;
  g.textAlign = 'center';
  g.fillText(CFG.label, W / 2, 372 * SY + (1 - labP) * 20 * SY);
  g.restore();

  /* 大数字：滚动 */
  const numP = quintOut(win(T, 0.45, 3.10));
  const shown = CFG.value * numP;
  const numStr = fmt(shown);

  g.save();
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  g.font = `700 ${NUM_PX}px ${MONO}`;
  const numW = g.measureText(numStr).width;
  g.font = `700 ${SMALL_PX}px ${SANS}`;
  const unitW = CFG.unit ? g.measureText(CFG.unit).width + UNIT_GAP : 0;
  const preW = CFG.prefix ? g.measureText(CFG.prefix).width + PRE_GAP : 0;
  const totalW = preW + numW + unitW;
  const startX = W / 2 - totalW / 2;

  /* 轻微数字弹入 */
  const pop = outExpo(win(T, 0.45, 1.15));
  g.globalAlpha = clamp(pop, 0, 1);
  const yBase = 640 * SY;
  g.fillStyle = CFG.ink;

  let x = startX;
  if (CFG.prefix) {
    g.font = `700 ${SMALL_PX}px ${SANS}`;
    g.fillStyle = 'rgba(244,247,252,0.55)';
    g.fillText(CFG.prefix, x + g.measureText(CFG.prefix).width / 2, yBase - 96 * SF * FIT_K);
    g.fillStyle = CFG.ink;
    x += preW;
  }
  g.font = `700 ${NUM_PX}px ${MONO}`;
  g.fillText(numStr, x + numW / 2, yBase);
  x += numW;
  if (CFG.unit) {
    g.font = `700 ${SMALL_PX}px ${SANS}`;
    g.fillStyle = 'rgba(244,247,252,0.55)';
    g.fillText(CFG.unit, x + unitW / 2, yBase - 22 * SF * FIT_K);
  }
  g.restore();

  /* 涨跌标签 */
  if (CFG.delta) {
    const p = outExpo(win(T, 2.85, 3.55));
    if (p > 0) {
      const color = CFG.delta.up ? '#FF6B6B' : '#5FE0C0';   // 中国市场惯例：涨红跌绿
      const tint = CFG.delta.up ? 'rgba(255,107,107,0.16)' : 'rgba(95,224,192,0.16)';
      g.save();
      g.globalAlpha = p;
      g.font = `600 ${34 * SF}px ${SANS}`;
      const tw = g.measureText(CFG.delta.text).width;
      const bw = tw + 56 * SX, bh = 62 * SF;
      const bx = W / 2 - bw / 2, by = 730 * SY + (1 - p) * 16 * SY;
      g.fillStyle = tint;
      g.beginPath();
      if (g.roundRect) g.roundRect(bx, by, bw, bh, 31 * SF); else g.rect(bx, by, bw, bh);
      g.fill();
      g.fillStyle = color;
      g.textAlign = 'center';
      g.fillText(CFG.delta.text, W / 2, by + 43 * SF);
      g.restore();
    }
  }

  /* 底部进度条 */
  const barW = 900 * SX, barX = (W - barW) / 2, barY = 830 * SY, barH = 8 * SF;
  const barIn = outCubic(win(T, 3.30, 4.30));
  g.save();
  g.globalAlpha = 0.12 * barIn;
  g.fillStyle = CFG.ink;
  g.fillRect(barX, barY, barW, barH);
  g.globalAlpha = barIn;
  g.fillStyle = CFG.accent;
  g.fillRect(barX, barY, barW * CFG.barRatio * barIn, barH);
  g.restore();

  /* 脚注 */
  const noP = outCubic(win(T, 4.2, 4.9));
  if (noP > 0) {
    g.save();
    g.globalAlpha = noP * 0.42;
    g.fillStyle = CFG.ink;
    g.font = `400 ${24 * SF}px ${SANS}`;
    g.textAlign = 'center';
    g.fillText(CFG.foot, W / 2, H - 180 * SY);
    g.restore();
  }
}

/* ---------- 渲染契约：这段不要改 ---------- */
function renderAt(t) { drawFrame(clamp(t, 0, DUR - 0.001)); }
window.__seek = renderAt;
window.__ready = true;
if (window.__seekRender) {
  renderAt(0);
} else {
  let cur = 0, last = null, playing = true;
  const tick = now => {
    if (last === null) last = now;
    if (playing) cur = (cur + Math.min(0.05, (now - last) / 1000)) % DUR;
    last = now; renderAt(cur); requestAnimationFrame(tick);
  };
  document.addEventListener('click', () => { playing = !playing; });
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
