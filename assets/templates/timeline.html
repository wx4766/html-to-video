<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板 · 时间线</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; top: 0; left: 0; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="./themes.js"></script>
<script>
/* =====================================================================
   模板 ⑤  ·  竖向时间线 / 流程步骤
   ---------------------------------------------------------------------
   用途：发展历程、项目排期、操作步骤。中轴自上而下生长，
   节点逐个点亮。改 CFG.items 即可。说明太长会自动换行（最多两行）。

   出片：
     bash ../render.sh timeline.html --duration=7 --fps=60
     bash ../render.sh timeline.html --duration=7 --fps=60 --width=1080 --height=1920

   换配色：改 CFG.theme，或命令行 --theme=paper 覆盖（midnight / paper / neon）。
   ===================================================================== */
const CFG = {
  theme: 'midnight',           // midnight | paper | neon，或直接传对象
  title: '项目里程碑',
  sub:   '从立项到上线',
  items: [                     // ← 改这里：3–6 条最好看
    { date: '2026.03', title: '立项',   desc: '需求评审通过，确定范围与验收标准' },
    { date: '2026.05', title: '原型',   desc: '交互原型与视觉方向定稿' },
    { date: '2026.07', title: '开发',   desc: '核心链路打通，进入联调' },
    { date: '2026.09', title: '上线',   desc: '灰度放量，指标达标' },
  ],
  dur:  7.0,
};
/* ===================================================================== */

/* ---------- 舞台：跟随视口 ---------- */
const cv = document.getElementById('stage');
const W = Math.max(1, Math.round(window.innerWidth));
const H = Math.max(1, Math.round(window.innerHeight));
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';

const DUR = CFG.dur;
/* 三档缩放：1920×1080 时 SX=SY=SF=1（与旧版逐像素一致） */
const SX = W / 1920, SY = H / 1080, SF = Math.sqrt(SX * SY);
const PORTRAIT = H > W;

const g = cv.getContext('2d');
const SANS = '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';

/* 主题：命令行 --theme 优先于 CFG.theme；themes.js 缺失时用兜底深色板 */
const TH = window.h2vTheme ? h2vTheme(window.__h2vTheme || CFG.theme) : {
  bg: '#080A10', ink: '#F4F7FC', accent: '#FFB86B',
};
const RGBA = window.h2vRgba || function (hex, a) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + (a === undefined ? 1 : a) + ')';
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const smooth = t => { t = clamp(t, 0, 1); return t * t * t * (10 - 15 * t + 6 * t * t); };

/* 中轴范围：底部留白 >15%，末条说明不落进烧录字幕带 */
const SPINE_X = 470 * SX, SPINE_Y0 = 280 * SY, SPINE_Y1 = 840 * SY;
const N = CFG.items.length;
const STEP = N > 1 ? (SPINE_Y1 - SPINE_Y0) / (N - 1) : 0;
const nodeY = i => SPINE_Y0 + i * STEP;
const TX = SPINE_X + 76 * SX;                     // 文字左边界
const DESC_PX = 30 * SF, DESC_LH = 40 * SY;       // 说明字号 / 行高
const DESC_MAXW = Math.max(60, W - TX - 140 * SX);

/* 按字换行（中文无空格，逐字量宽最稳） */
function wrapChars(text, maxW, maxLines) {
  const chars = [...text];
  const lines = [];
  let cur = '';
  for (let i = 0; i < chars.length; i++) {
    const next = cur + chars[i];
    if (cur === '' || g.measureText(next).width <= maxW) {
      cur = next;
    } else {
      lines.push(cur);
      cur = chars[i];
      if (lines.length === maxLines) {             // 行数用尽，剩下的截断加省略号
        lines[maxLines - 1] = lines[maxLines - 1].replace(/.$/, '') + '…';
        return lines;
      }
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawFrame(T) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);

  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, TH.bg);
  bg.addColorStop(1, TH.bgFar || '#0D111B');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  /* 环境光扫：一条极淡的光带缓慢横移 —— 「定格待读」的那几秒画面不会显得死 */
  const SWEEP = TH.sweep || '255,255,255';
  const scx = (T / DUR * 1.6 - 0.3) * (W + 1200 * SX) - 600 * SX;
  const sweep = g.createLinearGradient(scx - 620 * SF, 0, scx + 620 * SF, H);
  sweep.addColorStop(0, `rgba(${SWEEP},0)`);
  sweep.addColorStop(0.5, `rgba(${SWEEP},0.05)`);
  sweep.addColorStop(1, `rgba(${SWEEP},0)`);
  g.fillStyle = sweep;
  g.fillRect(0, 0, W, H);

  /* 标题 */
  const tiP = outCubic(win(T, 0.10, 0.75));
  g.save();
  g.globalAlpha = tiP;
  g.fillStyle = TH.ink;
  g.font = `700 ${62 * SF}px ${SANS}`;
  g.fillText(CFG.title, 160 * SX, 168 * SY);
  g.globalAlpha = tiP * 0.55;
  g.font = `400 ${30 * SF}px ${SANS}`;
  g.fillText(CFG.sub, 160 * SX, 226 * SY);
  g.restore();

  /* 中轴底轨 + 生长中的实轴 */
  const grow = smooth(win(T, 0.55, 1.55 + N * 0.62));
  g.save();
  g.globalAlpha = 0.12;
  g.fillStyle = TH.ink;
  g.fillRect(SPINE_X - 2 * SF, SPINE_Y0, 4 * SF, SPINE_Y1 - SPINE_Y0);
  g.globalAlpha = 1;
  const gh = (SPINE_Y1 - SPINE_Y0 + 30 * SY) * grow;
  const grad = g.createLinearGradient(0, SPINE_Y0, 0, SPINE_Y0 + gh);
  grad.addColorStop(0, RGBA(TH.accent, 0.95));
  grad.addColorStop(1, RGBA(TH.accentDeep || '#FF8A3D', 0.75));
  g.fillStyle = grad;
  g.fillRect(SPINE_X - 2 * SF, SPINE_Y0, 4 * SF, gh);
  g.restore();

  /* 节点 */
  CFG.items.forEach((it, i) => {
    const y = nodeY(i);
    const reach = clamp((grow * (SPINE_Y1 - SPINE_Y0 + 30 * SY) - (y - SPINE_Y0)) / (40 * SY), 0, 1); // 轴到没到
    const on = outExpo(reach);
    const contentP = outExpo(clamp((T - (1.15 + i * 0.42)) / 0.65, 0, 1));

    /* 日期（轴左侧，右对齐） */
    g.save();
    g.globalAlpha = contentP * 0.62;
    g.fillStyle = TH.ink;
    g.font = `500 ${30 * SF}px ${MONO}`;
    g.textAlign = 'right';
    g.fillText(it.date, SPINE_X - 76 * SX, y + 11 * SF);
    g.restore();

    /* 连接短横 */
    g.save();
    g.globalAlpha = 0.35 * on;
    g.fillStyle = TH.accent;
    g.fillRect(SPINE_X + 20 * SX, y - 1.5 * SF, 34 * SX * clamp(contentP * 1.5, 0, 1), 3 * SF);
    g.restore();

    /* 节点圆点：外圈光晕 + 内芯 */
    const r = lerp(7 * SF, 13 * SF, on);
    g.save();
    if (on > 0.05) {
      const halo = g.createRadialGradient(SPINE_X, y, 0, SPINE_X, y, 52 * SF * on);
      halo.addColorStop(0, RGBA(TH.accent, 0.42));
      halo.addColorStop(1, RGBA(TH.accent, 0));
      g.fillStyle = halo;
      g.beginPath(); g.arc(SPINE_X, y, 52 * SF * on, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = on > 0.5 ? TH.accent : RGBA(TH.ink, 0.22);
    g.beginPath(); g.arc(SPINE_X, y, r, 0, Math.PI * 2); g.fill();
    if (on > 0.5) {
      g.fillStyle = TH.bg;
      g.beginPath(); g.arc(SPINE_X, y, r * 0.42, 0, Math.PI * 2); g.fill();
    }
    g.restore();

    /* 标题 + 说明 */
    const tx = TX + (1 - contentP) * 24 * SX;
    g.save();
    g.globalAlpha = contentP;
    g.fillStyle = TH.ink;
    g.font = `600 ${46 * SF}px ${SANS}`;
    g.fillText(it.title, tx, y - 4 * SF);
    g.globalAlpha = contentP * 0.55;
    g.font = `400 ${DESC_PX}px ${SANS}`;
    const lines = wrapChars(it.desc, DESC_MAXW, 2);
    lines.forEach((ln, li) => {
      g.fillText(ln, tx, y + 52 * SY + li * DESC_LH);
    });
    g.restore();
  });
}

/* ---------- 渲染契约：这段不要改 ---------- */
function renderAt(t) { drawFrame(clamp(t, 0, DUR - 0.001)); }
window.__seek = renderAt;
window.__ready = true;
if (window.__seekRender) {
  renderAt(0);
} else {
  let cur = 0, last = null, playing = true;
  const tick = now => {
    if (last === null) last = now;
    if (playing) cur = (cur + Math.min(0.05, (now - last) / 1000)) % DUR;
    last = now; renderAt(cur); requestAnimationFrame(tick);
  };
  document.addEventListener('click', () => { playing = !playing; });
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
