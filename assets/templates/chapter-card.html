<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板 · 章节卡</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; top: 0; left: 0; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="./themes.js"></script>
<script>
/* =====================================================================
   模板 ⑫  ·  章节卡 / 序号过渡页
   ---------------------------------------------------------------------
   用途：把一条长片切成几段。观众需要"我们进入下一个话题了"的信号，
   否则 40 秒以后就分不清讲到哪儿了。

   和片头卡的区别：
     · 片头要抓人（逐字弹入、大字）；
     · 章节卡要**克制**（一个序号、一行标题、一条进度），
       它是标点符号，不是内容本身。停留 2–4 秒最合适。

   出片：
     bash ../render.sh chapter-card.html --duration=4 --fps=60
   换风格（章节卡特别吃风格：蓝图/瑞士/水墨各有各的味道）：
     bash ../render.sh chapter-card.html --duration=4 --theme=blueprint

   接上配乐就自动"跳到拍上"：
     bash ../render.sh chapter-card.html --duration=3.6 --audio=bgm.mp3 --beats --snap=beats
   ===================================================================== */
const CFG = {
  theme: 'midnight',
  kicker: '第二章',            // 上方小字（留空则不画）
  num:    '02',                // 大序号（两位更好看；三位会自动缩）
  title:  ['从纸', '到屏幕'],   // 章节标题，一行一个字符串
  sub:    '把排版逻辑搬进浏览器',  // 一句话说明（留空则不画）
  total:  5,                   // 全片共几章（底部进度点用）
  index:  2,                   // 当前是第几章（从 1 开始）
  dur:    4.0,
};
/* ===================================================================== */

const cv = document.getElementById('stage');
const W = Math.max(1, Math.round(window.innerWidth));
const H = Math.max(1, Math.round(window.innerHeight));
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';

const DUR = CFG.dur;
const SX = W / 1920, SY = H / 1080, SF = Math.sqrt(SX * SY);
const PORTRAIT = H > W;
const g = cv.getContext('2d');
const TRANSPARENT = !!window.__transparent;

const TH = window.h2vTheme ? h2vTheme(window.__h2vTheme || CFG.theme) : {
  bg: '#080A10', ink: '#F4F7FC', accent: '#FFB86B',
};
const RGBA = window.h2vRgba || ((hex, a) => hex);
const ST = TH.__style || null;      // 风格对象（有的话就用它的纸/网格/材质）

const SANS = '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';
const SERIF = '"Songti SC", "SimSun", Georgia, serif';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t));
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

/* 节拍脉冲：没有 --beats 时恒为 0，画面与旧版一致 */
const pulse = (window.SV && SV.pulse) ? (t) => SV.pulse(t, { decay: 0.16 }) : () => 0;

const LX = PORTRAIT ? W * 0.10 : W * 0.11;
const MAXW = W - LX * 2;

function fit(text, basePx, maxW, font) {
  g.save(); g.font = font(basePx);
  const w = g.measureText(text).width;
  g.restore();
  return w > maxW && w > 0 ? Math.max(basePx * 0.4, basePx * maxW / w) : basePx;
}

/* 大序号：描边字。章节卡里它比标题更抢眼，所以用"空心"而不是实心 ——
   实心大数字会把标题压下去，而空心只剩骨架，正好当背景。 */
function drawNum(p) {
  if (!p) return;
  const size = (PORTRAIT ? 260 : 320) * SF;
  /* 序号放右侧当"水印"。早期版本放在左侧，正好被标题和 kicker 压住 ——
     实测"第二章"三个字叠在数字 0 的笔画上，两样都读不清。 */
  const y = PORTRAIT ? H * 0.26 : H * 0.68;
  const x = PORTRAIT ? W * 0.92 : W * 0.90;
  g.save();
  g.globalAlpha = p * 0.26;
  /* 用无衬线而不是等宽：Linux 上的等宽回退字体把 0 画成带方点的样子，
     放大到 320px 时那个方点像渲染出来的脏块。无衬线的 0 是干净椭圆。 */
  g.font = `900 ${size}px ${SANS}`;
  g.textAlign = 'right';
  g.textBaseline = 'alphabetic';
  g.lineWidth = Math.max(1.5, 2.4 * SF);
  g.strokeStyle = TH.accent;
  // 序号从下往上"长"出来：用 clip 做擦除，比改 alpha 更有"数字在写"的感觉
  g.beginPath();
  g.rect(LX - 20 * SX, y - size * 1.05, W, size * 1.2 * clamp(p));
  g.clip();
  g.strokeText(CFG.num, x, y);
  g.restore();
}

function drawFrame(t) {
  const T = clamp(t, 0, DUR - 0.001);
  const bt = pulse(T);

  g.clearRect(0, 0, W, H);

  /* 背景 */
  if (!TRANSPARENT) {
    if (ST && SV.bgCached) SV.bgCached(g, ST, W, H, T, {}, 1);
    else {
      const lg = g.createLinearGradient(0, 0, W, H);
      lg.addColorStop(0, TH.bg);
      lg.addColorStop(1, TH.bgAlt || TH.bg);
      g.fillStyle = lg; g.fillRect(0, 0, W, H);
    }
  }

  /* 大序号（先画，标题压在它上面） */
  drawNum(outExpo(win(T, 0.05, 0.85)));

  /* 左侧竖线：从中间向两端长，作为"章节"的视觉锚点 */
  const lineP = smooth(win(T, 0.15, 0.9));
  if (lineP > 0) {
    const lh = (PORTRAIT ? H * 0.30 : H * 0.42) * lineP;
    const cy = PORTRAIT ? H * 0.44 : H * 0.47;
    g.save();
    g.strokeStyle = TH.accent;
    g.lineWidth = (2.5 + bt * 2.5) * SF;
    g.beginPath();
    g.moveTo(LX - 26 * SX, cy - lh / 2);
    g.lineTo(LX - 26 * SX, cy + lh / 2);
    g.stroke();
    g.restore();
  }

  /* 上方 kicker */
  const kP = smooth(win(T, 0.3, 0.95));
  if (CFG.kicker && kP > 0) {
    const px = fit(CFG.kicker, 26 * SF, MAXW * 0.7, p => `500 ${p}px ${SANS}`);
    g.save();
    g.globalAlpha = kP * 0.72;
    g.fillStyle = TH.accent;
    g.font = `500 ${px}px ${SANS}`;
    if ('letterSpacing' in g) g.letterSpacing = `${0.16 * px}px`;
    g.fillText(CFG.kicker, LX, (PORTRAIT ? H * 0.36 : H * 0.34) - 26 * SY);
    g.restore();
  }

  /* 标题：逐行，行内按字推进 */
  const titleSize = (PORTRAIT ? 86 : 104) * SF;
  let y = PORTRAIT ? H * 0.42 : H * 0.40;
  CFG.title.forEach((line, li) => {
    const start = 0.42 + li * 0.20;
    const lp = outExpo(win(T, start, start + 0.55));
    if (lp <= 0) return;
    const px = fit(line, titleSize, MAXW, p => `700 ${p}px ${SANS}`);
    const chars = [...line];
    g.save();
    g.font = `700 ${px}px ${SANS}`;
    g.textBaseline = 'alphabetic';
    g.fillStyle = TH.ink;
    let x = LX;
    chars.forEach((ch, i) => {
      const cp = outExpo(clamp((T - start - i * 0.035) / 0.45, 0, 1));
      if (cp > 0) {
        g.globalAlpha = cp;
        g.fillText(ch, x, y + (1 - cp) * px * 0.28);
      }
      x += g.measureText(ch).width;
    });
    g.restore();
    y += px * 1.14;
  });

  /* 副标题 */
  const sP = outExpo(win(T, 1.05, 1.65));
  if (CFG.sub && sP > 0) {
    const px = fit(CFG.sub, 32 * SF, MAXW, p => `400 ${p}px ${SANS}`);
    g.save();
    g.globalAlpha = sP * 0.80;
    g.fillStyle = TH.ink;
    g.font = `400 ${px}px ${SANS}`;
    g.fillText(CFG.sub, LX + (1 - sP) * 14 * SX, y + 18 * SY);
    g.restore();
  }

  /* 底部进度点：当前章实心、已过章半透明、未到章只有描边 */
  const total = Math.max(1, Math.min(12, Number(CFG.total) || 1));
  const idx = Math.max(1, Math.min(total, Number(CFG.index) || 1));
  const dP = smooth(win(T, 0.9, 1.5));
  if (dP > 0) {
    const r = 5 * SF;
    const gap = 30 * SF;
    const y0 = H * 0.86;
    g.save();
    for (let i = 0; i < total; i++) {
      const cx = LX + r + i * gap;
      const done = i + 1 <= idx;
      g.globalAlpha = dP * (i + 1 === idx ? 1 : (done ? 0.55 : 0.28));
      g.beginPath();
      g.arc(cx, y0, i + 1 === idx ? r * 1.25 : r, 0, Math.PI * 2);
      if (i + 1 === idx) {
        g.fillStyle = TH.accent;
        g.fill();
      } else if (done) {
        g.fillStyle = TH.ink; g.fill();
      } else {
        g.strokeStyle = TH.ink; g.lineWidth = 1.4 * SF; g.stroke();
      }
    }
    // 当前章的进度线（只在有拍点时轻微跳动，作为"还在播"的暗示）
    g.globalAlpha = dP * 0.5;
    g.fillStyle = TH.accent;
    g.fillRect(LX, y0 + 22 * SY, (idx / total) * (total * gap) * (0.98 + bt * 0.02), 1.6 * SF);
    g.restore();
  }

  if (ST && SV.overlay) SV.overlay(g, ST, W, H, T, {});
}

/* ---------- 渲染契约：这段不要改 ---------- */
function renderAt(t) { drawFrame(clamp(t, 0, DUR - 0.001)); }
window.__seek = renderAt;
window.__ready = true;
if (window.__seekRender) {
  renderAt(0);
} else {
  let cur = 0, last = null, playing = true;
  const tick = now => {
    if (last === null) last = now;
    if (playing) cur = (cur + Math.min(0.05, (now - last) / 1000)) % DUR;
    last = now; renderAt(cur); requestAnimationFrame(tick);
  };
  document.addEventListener('click', () => { playing = !playing; });
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
