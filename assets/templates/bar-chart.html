<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板 · 条形图对比</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; top: 0; left: 0; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="./themes.js"></script>
<script>
/* =====================================================================
   模板 ②  ·  横向条形图对比 / 排名
   ---------------------------------------------------------------------
   用途：业绩对比、排名、份额拆分。条形依次生长，数值同步滚动。
   改 CFG.data 即可（按数值从大到小排，第一条会高亮）。

   出片（横屏 / 竖屏都直接用，模板按视口自适应）：
     bash ../render.sh bar-chart.html --duration=6 --fps=60
     bash ../render.sh bar-chart.html --duration=6 --fps=60 --width=1080 --height=1920

   换配色：改 CFG.theme，或命令行 --theme=paper 覆盖（midnight / paper / neon）。
   逐色调微调改 themes.js，不要在下面的画布代码里写死色值。
   ===================================================================== */
const CFG = {
  theme:    'midnight',            // midnight | paper | neon，或直接传对象
  title:    '上半年各渠道新增用户',
  sub:      '单位：万人 · 数据截至 6 月 30 日',
  unit:     '',                 // 数值后缀，如 '万元'、'%'；空则不加
  data: [                       // ← 改这里：第一条自动高亮
    { label: '应用商店', value: 128.4 },
    { label: '短视频投放', value: 96.2 },
    { label: '老带新',   value: 61.7 },
    { label: '线下活动', value: 38.5 },
    { label: '搜索广告', value: 24.1 },
  ],
  note:  '数据来源：示例数据，替换成你自己的',
  dur:   6.0,
};
/* ===================================================================== */

/* ---------- 舞台：跟随视口 ---------- */
const cv = document.getElementById('stage');
const W = Math.max(1, Math.round(window.innerWidth));
const H = Math.max(1, Math.round(window.innerHeight));
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';

const DUR = CFG.dur;
/* 三档缩放：1920×1080 时 SX=SY=SF=1（与旧版逐像素一致） */
const SX = W / 1920, SY = H / 1080, SF = Math.sqrt(SX * SY);
const PORTRAIT = H > W;

const g = cv.getContext('2d');
const SANS = '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';

/* 主题：命令行 --theme 优先于 CFG.theme；themes.js 缺失时用兜底深色板，照样能出片 */
const TH = window.h2vTheme ? h2vTheme(window.__h2vTheme || CFG.theme) : {
  bg: '#080A10', ink: '#F4F7FC', accent: '#FFB86B',
};
/* 同色不同透明度：光晕 / 渐变要用，themes.js 里有 h2vRgba，缺了就在本地算 */
const RGBA = window.h2vRgba || function (hex, a) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + (a === undefined ? 1 : a) + ')';
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const fmt = v => v.toLocaleString('zh-CN', { maximumFractionDigits: 1 });

/* 图表几何（设计稿 1920×1080 坐标系，再按 SX/SY 落到实际画布） */
const X0 = 560 * SX, X1 = 1700 * SX;               // 条形起点 / 最大终点
const Y0 = 286 * SY, ROW = 116 * SY, BAR = 56 * SY; // 底部留白 >15%，避免落进烧录字幕带
const MAXV = Math.max(...CFG.data.map(d => d.value));
const LEFT = 160 * SX;                             // 左页边距
const GAP_LABEL = 40 * SX;                         // 标签与条形的间距

/* 标签列太窄时自动缩字号，不压到边、不撞条形 */
const LABEL_MAXW = Math.max(20, X0 - GAP_LABEL - LEFT);
let LABEL_PX = 36 * SF;
{
  let widest = 0;
  g.save();
  g.font = `500 ${LABEL_PX}px ${SANS}`;
  CFG.data.forEach(d => { widest = Math.max(widest, g.measureText(d.label).width); });
  g.restore();
  if (widest > LABEL_MAXW) LABEL_PX = Math.max(12, LABEL_PX * LABEL_MAXW / widest);
}

function drawFrame(T) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);

  /* 背景 */
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, TH.bg);
  bg.addColorStop(1, TH.bgFar || '#0D111B');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  /* 环境光扫：一条极淡的光带缓慢横移 —— 「定格待读」的那几秒画面不会显得死 */
  /* 浅色底上用白光扫等于没画，所以扫光颜色跟着主题走（TH.sweep 是 "r,g,b"） */
  const SWEEP = TH.sweep || '255,255,255';
  const scx = (T / DUR * 1.6 - 0.3) * (W + 1200 * SX) - 600 * SX;
  const sweep = g.createLinearGradient(scx - 620 * SF, 0, scx + 620 * SF, H);
  sweep.addColorStop(0, `rgba(${SWEEP},0)`);
  sweep.addColorStop(0.5, `rgba(${SWEEP},0.05)`);
  sweep.addColorStop(1, `rgba(${SWEEP},0)`);
  g.fillStyle = sweep;
  g.fillRect(0, 0, W, H);

  /* 标题 */
  const tiP = outCubic(win(T, 0.10, 0.75));
  g.save();
  g.globalAlpha = tiP;
  g.fillStyle = TH.ink;
  g.font = `700 ${62 * SF}px ${SANS}`;
  g.fillText(CFG.title, LEFT, 168 * SY + (1 - tiP) * 24 * SY);
  g.globalAlpha = tiP * 0.55;
  g.font = `400 ${30 * SF}px ${SANS}`;
  g.fillText(CFG.sub, LEFT, 226 * SY);
  g.restore();

  /* 基线 */
  const axP = outCubic(win(T, 0.30, 0.90));
  g.save();
  g.globalAlpha = 0.16 * axP;
  g.fillStyle = TH.ink;
  g.fillRect(X0, Y0 - 26 * SY, 2 * SF, CFG.data.length * ROW + 20 * SY);
  g.restore();

  /* 条形 */
  CFG.data.forEach((d, i) => {
    const cy = Y0 + i * ROW + ROW / 2;
    const top = cy - BAR / 2;
    const t0 = 0.45 + i * 0.16;
    const grow = outExpo(win(T, t0, t0 + 0.95));       // 生长
    const fade = outCubic(win(T, t0 - 0.15, t0 + 0.35)); // 行淡入
    const isTop = i === 0;
    const fullW = (d.value / MAXV) * (X1 - X0);
    const w = fullW * grow;

    /* 行背景条（刻度容器） */
    g.save();
    g.globalAlpha = 0.05 * fade;
    g.fillStyle = TH.ink;
    g.fillRect(X0, top, X1 - X0, BAR);
    g.restore();

    /* 数值条 */
    if (w > 0) {
      const grad = g.createLinearGradient(X0, 0, X0 + Math.max(w, 1), 0);
      if (isTop) {
        grad.addColorStop(0, TH.accentDeep || '#FF8A3D');
        grad.addColorStop(1, TH.accent);
      } else {
        grad.addColorStop(0, RGBA(TH.accentSoft || '#5FE0C0', 0.55));
        grad.addColorStop(1, RGBA(TH.accentSoft || '#5FE0C0', 0.85));
      }
      g.fillStyle = grad;
      g.fillRect(X0, top, w, BAR);
    }

    /* 左侧标签 */
    g.save();
    g.globalAlpha = fade * 0.92;
    g.fillStyle = TH.ink;
    g.font = `500 ${LABEL_PX}px ${SANS}`;
    g.textAlign = 'right';
    g.fillText(d.label, X0 - GAP_LABEL, cy + 13 * SF);
    g.restore();

    /* 数值（跟着条尾走；条太靠右就挪到条内右端，绝不越界） */
    if (grow > 0.02) {
      const vPx = 40 * SF;
      g.save();
      g.globalAlpha = clamp(fade * grow * 1.4, 0, 1);
      g.font = `700 ${vPx}px ${MONO}`;
      const shown = d.value * grow;
      const label = fmt(shown) + CFG.unit;
      const tw = g.measureText(label).width;
      if (X0 + w + 26 * SX + tw > W - 40 * SX) {
        /* 放不下：进条内，用底色写字（深底片=深字，浅底片=浅字，对比度自动对） */
        g.textAlign = 'right';
        g.fillStyle = RGBA(TH.bg, 0.88);
        g.fillText(label, X0 + w - 18 * SX, cy + 14 * SF);
      } else {
        g.fillStyle = isTop ? TH.accent : RGBA(TH.accentSoft || '#5FE0C0', 0.95);
        g.fillText(label, X0 + w + 26 * SX, cy + 14 * SF);
      }
      g.restore();
    }
  });

  /* 脚注 */
  const noP = outCubic(win(T, 1.9, 2.5));
  if (noP > 0) {
    g.save();
    g.globalAlpha = noP * 0.42;
    g.fillStyle = TH.ink;
    g.font = `400 ${24 * SF}px ${SANS}`;
    g.fillText(CFG.note, LEFT, H - 190 * SY);
    g.restore();
  }
}

/* ---------- 渲染契约：这段不要改 ---------- */
function renderAt(t) { drawFrame(clamp(t, 0, DUR - 0.001)); }
window.__seek = renderAt;
window.__ready = true;
if (window.__seekRender) {
  renderAt(0);
} else {
  let cur = 0, last = null, playing = true;
  const tick = now => {
    if (last === null) last = now;
    if (playing) cur = (cur + Math.min(0.05, (now - last) / 1000)) % DUR;
    last = now; renderAt(cur); requestAnimationFrame(tick);
  };
  document.addEventListener('click', () => { playing = !playing; });
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
