<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板 · 折线趋势</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: absolute; top: 0; left: 0; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
/* =====================================================================
   模板 ③  ·  折线趋势图
   ---------------------------------------------------------------------
   用途：月度/年度趋势、增长曲线。折线从左往右生长，数据点依次亮起，
   末点自动出数值浮标。改 CFG.x / CFG.y 即可。
   横屏竖屏都直接可用：模板按视口自适应，标签挤了会自动隔一个画一个。

   出片：
     bash ../render.sh line-chart.html --duration=8 --fps=60
     bash ../render.sh line-chart.html --duration=8 --fps=60 --width=1080 --height=1920
   ===================================================================== */
const CFG = {
  title: '月活跃用户趋势',
  sub:   '单位：万人',
  x: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
  y: [42, 48, 45, 58, 66, 63, 78, 88, 84, 96, 108, 121],
  yTicks: 5,                    // 纵轴刻度线数量
  note: '数据来源：示例数据，替换成你自己的',
  dur:  8.0,
  accent: '#FFB86B',
  line:   '#5FE0C0',
  ink:    '#F4F7FC',
  bg:     '#080A10',
};
/* ===================================================================== */

/* ---------- 舞台：跟随视口 ---------- */
const cv = document.getElementById('stage');
const W = Math.max(1, Math.round(window.innerWidth));
const H = Math.max(1, Math.round(window.innerHeight));
cv.width = W; cv.height = H;
cv.style.width = W + 'px'; cv.style.height = H + 'px';

const DUR = CFG.dur;
/* 三档缩放：1920×1080 时 SX=SY=SF=1（与旧版逐像素一致） */
const SX = W / 1920, SY = H / 1080, SF = Math.sqrt(SX * SY);
const PORTRAIT = H > W;

const g = cv.getContext('2d');
const SANS = '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const smooth = t => { t = clamp(t, 0, 1); return t * t * t * (10 - 15 * t + 6 * t * t); };

/* 绘图区（底部留白 >15%，避免横轴标签落进烧录字幕带） */
const PL = 250 * SX, PR = 1720 * SX, PT = 300 * SY, PB = 790 * SY;
const YMAX = Math.ceil(Math.max(...CFG.y) / 20) * 20;      // 纵轴上限取整到 20

const PX = i => PL + (PR - PL) * (i / (CFG.x.length - 1));
const PY = v => PB - (PB - PT) * (v / YMAX);

/* 横轴标签挤了就隔一个画一个（1920 宽下间距 133px，永远不触发） */
const XLABEL_PX = 26 * SF;
let XLABEL_STEP = 1;
{
  const spacing = (PR - PL) / Math.max(1, CFG.x.length - 1);
  let widest = 0;
  g.save();
  g.font = `400 ${XLABEL_PX}px ${SANS}`;
  CFG.x.forEach(lab => { widest = Math.max(widest, g.measureText(lab).width); });
  g.restore();
  while (XLABEL_STEP < CFG.x.length && spacing * XLABEL_STEP < widest * 1.15) XLABEL_STEP++;
}

function drawFrame(T) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);

  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, CFG.bg);
  bg.addColorStop(1, '#0D111B');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  /* 环境光扫：一条极淡的光带缓慢横移 —— 「定格待读」的那几秒画面不会显得死 */
  const scx = (T / DUR * 1.6 - 0.3) * (W + 1200 * SX) - 600 * SX;
  const sweep = g.createLinearGradient(scx - 620 * SF, 0, scx + 620 * SF, H);
  sweep.addColorStop(0, 'rgba(255,255,255,0)');
  sweep.addColorStop(0.5, 'rgba(255,255,255,0.05)');
  sweep.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sweep;
  g.fillRect(0, 0, W, H);

  /* 标题 */
  const tiP = outCubic(win(T, 0.10, 0.75));
  g.save();
  g.globalAlpha = tiP;
  g.fillStyle = CFG.ink;
  g.font = `700 ${62 * SF}px ${SANS}`;
  g.fillText(CFG.title, 160 * SX, 168 * SY);
  g.globalAlpha = tiP * 0.55;
  g.font = `400 ${30 * SF}px ${SANS}`;
  g.fillText(CFG.sub, 160 * SX, 226 * SY);
  g.restore();

  /* 网格 + 纵轴刻度 */
  const gridP = outCubic(win(T, 0.35, 1.05));
  g.save();
  g.font = `400 ${26 * SF}px ${MONO}`;
  g.textAlign = 'right';
  for (let k = 0; k <= CFG.yTicks; k++) {
    const v = YMAX * k / CFG.yTicks, y = PY(v);
    g.globalAlpha = 0.10 * gridP;
    g.fillStyle = CFG.ink;
    g.fillRect(PL, y, PR - PL, Math.max(1, SF));
    g.globalAlpha = 0.42 * gridP;
    g.fillText(String(Math.round(v)), PL - 28 * SX, y + 9 * SF);
  }
  /* 横轴标签 */
  g.textAlign = 'center';
  g.font = `400 ${XLABEL_PX}px ${SANS}`;
  CFG.x.forEach((lab, i) => {
    if (i % XLABEL_STEP !== 0 && i !== CFG.x.length - 1) return;
    const p = outCubic(win(T, 0.55 + i * 0.045, 0.95 + i * 0.045));
    if (p <= 0) return;
    g.globalAlpha = 0.5 * p;
    g.fillStyle = CFG.ink;
    g.fillText(lab, PX(i), PB + 56 * SY + (1 - p) * 10 * SY);
  });
  g.restore();

  /* 折线生长进度：0 → 1 对应横轴从左到右 */
  const grow = smooth(win(T, 0.80, 3.60));
  const head = grow * (CFG.x.length - 1);

  /* 面积填充 */
  if (head > 0.01) {
    g.save();
    g.beginPath();
    g.moveTo(PX(0), PY(CFG.y[0]));
    for (let i = 1; i < CFG.x.length; i++) {
      if (i <= head) { g.lineTo(PX(i), PY(CFG.y[i])); }
      else {
        const f = head - Math.floor(head), i0 = Math.floor(head);
        if (i0 + 1 < CFG.x.length) {
          g.lineTo(lerp(PX(i0), PX(i0 + 1), f), lerp(PY(CFG.y[i0]), PY(CFG.y[i0 + 1]), f));
        }
        break;
      }
    }
    const last = Math.min(head, CFG.x.length - 1);
    const ix = Math.floor(last), fx = last - ix;
    const hx = ix + 1 < CFG.x.length ? lerp(PX(ix), PX(ix + 1), fx) : PX(ix);
    const hy = ix + 1 < CFG.y.length ? lerp(PY(CFG.y[ix]), PY(CFG.y[ix + 1]), fx) : PY(CFG.y[ix]);
    g.lineTo(hx, PB);
    g.lineTo(PX(0), PB);
    g.closePath();
    const grad = g.createLinearGradient(0, PT, 0, PB);
    grad.addColorStop(0, 'rgba(95,224,192,0.26)');
    grad.addColorStop(1, 'rgba(95,224,192,0)');
    g.fillStyle = grad;
    g.fill();
    g.restore();

    /* 折线 */
    g.save();
    g.strokeStyle = CFG.line;
    g.lineWidth = 5 * SF;
    g.lineJoin = 'round';
    g.lineCap = 'round';
    g.shadowColor = 'rgba(95,224,192,0.55)';
    g.shadowBlur = 18 * SF;
    g.beginPath();
    g.moveTo(PX(0), PY(CFG.y[0]));
    for (let i = 1; i < CFG.x.length; i++) {
      if (i <= head) g.lineTo(PX(i), PY(CFG.y[i]));
      else {
        const ix2 = Math.floor(head), f = head - ix2;
        if (ix2 + 1 < CFG.x.length) g.lineTo(lerp(PX(ix2), PX(ix2 + 1), f), lerp(PY(CFG.y[ix2]), PY(CFG.y[ix2 + 1]), f));
        break;
      }
    }
    g.stroke();
    g.restore();
  }

  /* 数据点：线头过了才弹出来 */
  CFG.y.forEach((v, i) => {
    const p = outExpo(clamp((head - i) / 0.35, 0, 1));
    if (p <= 0) return;
    const r = lerp(0, 9 * SF, p);
    g.save();
    g.globalAlpha = p;
    g.fillStyle = CFG.bg;
    g.beginPath(); g.arc(PX(i), PY(v), r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = CFG.line; g.lineWidth = 4 * SF;
    g.beginPath(); g.arc(PX(i), PY(v), r, 0, Math.PI * 2); g.stroke();
    g.restore();
  });

  /* 末点浮标 */
  const lastI = CFG.x.length - 1;
  const tagP = outExpo(win(T, 4.05, 4.75));
  if (tagP > 0) {
    const x = PX(lastI), y = PY(CFG.y[lastI]);
    const label = String(CFG.y[lastI]);
    g.save();
    g.globalAlpha = tagP;
    g.font = `700 ${34 * SF}px ${MONO}`;
    const tw = g.measureText(label).width;
    const bx = x - tw - 74 * SX, by = y - 66 * SY;
    g.fillStyle = CFG.accent;
    g.beginPath();
    if (g.roundRect) g.roundRect(bx, by, tw + 48 * SX, 58 * SY, 12 * SF); else g.rect(bx, by, tw + 48 * SX, 58 * SY);
    g.fill();
    g.fillStyle = '#1A1206';
    g.fillText(label, bx + 24 * SX, by + 41 * SY);
    /* 小尾巴 */
    g.fillStyle = CFG.accent;
    g.beginPath();
    g.moveTo(x - 30 * SX, by + 58 * SY); g.lineTo(x - 12 * SX, by + 58 * SY); g.lineTo(x - 6 * SX, y - 4 * SY);
    g.closePath(); g.fill();
    g.restore();
  }

  /* 脚注 */
  const noP = outCubic(win(T, 4.6, 5.3));
  if (noP > 0) {
    g.save();
    g.globalAlpha = noP * 0.42;
    g.fillStyle = CFG.ink;
    g.font = `400 ${24 * SF}px ${SANS}`;
    g.fillText(CFG.note, 160 * SX, H - 190 * SY);
    g.restore();
  }
}

/* ---------- 渲染契约：这段不要改 ---------- */
function renderAt(t) { drawFrame(clamp(t, 0, DUR - 0.001)); }
window.__seek = renderAt;
window.__ready = true;
if (window.__seekRender) {
  renderAt(0);
} else {
  let cur = 0, last = null, playing = true;
  const tick = now => {
    if (last === null) last = now;
    if (playing) cur = (cur + Math.min(0.05, (now - last) / 1000)) % DUR;
    last = now; renderAt(cur); requestAnimationFrame(tick);
  };
  document.addEventListener('click', () => { playing = !playing; });
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
