<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板 · 片头标题卡</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  /* 画布必须正好铺满视口左上角 —— 渲染器按 (0,0,W,H) 裁剪截图 */
  #stage { position: absolute; top: 0; left: 0; display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   模板 ①  ·  片头标题卡
   ---------------------------------------------------------------------
   用途：视频开场 5–8 秒。主标题逐字弹入，配副标题与标签。
   改下面 CFG 里的字就够了，其余不用动。

   出片：
     bash ../render.sh title-card.html --duration=6 --fps=60
   ===================================================================== */
const CFG = {
  kicker: '逐帧渲染管线',                       // 上方小字（可留空 ''）
  title:  ['把代码', '变成画面'],                // 主标题，一行一个字符串
  sub:    'HTML / Canvas 写成 frame(t)，无头浏览器逐帧截图，ffmpeg 编成 MP4',  // 副标题
  tag:    '2026 · 示例片头',                    // 右下角标签
  dur:    6.0,                                 // 总时长（秒）——渲染时 --duration 要一致
  accent: '#FFB86B',                           // 强调色
  ink:    '#F4F7FC',                           // 主文字色
  bg:     '#080A10',                           // 底色
};
/* ===================================================================== */

const W = 1920, H = 1080, DUR = CFG.dur;
const cv = document.getElementById('stage');
const g = cv.getContext('2d');

const SANS = '"Microsoft YaHei", "PingFang SC", system-ui, sans-serif';
const MONO = 'ui-monospace, Consolas, "Courier New", monospace';

/* ---------- 小工具 ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);          // 时间窗 → 0..1
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);       // 快出慢停
const smooth = t => { t = clamp(t, 0, 1); return t * t * t * (10 - 15 * t + 6 * t * t); };  // 两端都停稳

/* 逐字排版 + 逐字进度：返回整串宽度。progress(i,n) → 0..1 */
function drawText(ctx, text, x, y, progress) {
  const chars = [...text];
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let cx = x;
  chars.forEach((c, i) => {
    const p = progress(i, chars.length);
    if (p > 0) {
      ctx.save();
      ctx.globalAlpha *= clamp(p, 0, 1);
      ctx.fillText(c, cx, y + (1 - p) * 46);                       // 从下方 46px 弹上来
      ctx.restore();
    }
    cx += widths[i];
  });
  return total;
}

/* ---------- 主绘制：t 时刻的完整画面 ---------- */
function drawFrame(T) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);

  /* 背景：深色渐变 + 缓慢呼吸的暖光斑 */
  const bg = g.createLinearGradient(0, 0, W * 0.6, H);
  bg.addColorStop(0, CFG.bg);
  bg.addColorStop(1, '#0E1420');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  const glowPhase = win(T, 0, 1.6);
  const gx = W * 0.72 + Math.sin(T * 0.35) * 40;
  const gy = H * 0.30 + Math.cos(T * 0.28) * 24;
  const rad = g.createRadialGradient(gx, gy, 0, gx, gy, 780);
  rad.addColorStop(0, `rgba(255,184,107,${0.16 * glowPhase})`);
  rad.addColorStop(0.55, `rgba(255,138,61,${0.05 * glowPhase})`);
  rad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rad;
  g.fillRect(0, 0, W, H);

  /* 环境光扫：一条极淡的光带缓慢横移 —— 「定格待读」的那几秒画面不会显得死 */
  const scx = (T / DUR * 1.6 - 0.3) * (W + 1200) - 600;
  const sweep = g.createLinearGradient(scx - 620, 0, scx + 620, H);
  sweep.addColorStop(0, 'rgba(255,255,255,0)');
  sweep.addColorStop(0.5, 'rgba(255,255,255,0.05)');
  sweep.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sweep;
  g.fillRect(0, 0, W, H);

  /* 左侧竖直装饰线（生长） */
  const lineP = smooth(win(T, 0.15, 1.0));
  g.fillStyle = CFG.accent;
  g.globalAlpha = 0.85 * lineP;
  g.fillRect(140, lerp(H * 0.5, 300, lineP), 3, lerp(0, 300, lineP));
  g.globalAlpha = 1;

  const LX = 200;   // 内容左边距

  /* 小字 kicker */
  if (CFG.kicker) {
    const p = outExpo(win(T, 0.30, 0.95));
    g.save();
    g.globalAlpha = p;
    g.fillStyle = 'rgba(244,247,252,0.62)';
    g.font = `500 28px ${SANS}`;
    g.letterSpacing = '10px';                                     // 现代浏览器支持
    g.fillText(CFG.kicker, LX + (1 - p) * -22, 386);
    g.restore();
  }

  /* 主标题：逐字 */
  g.save();
  g.fillStyle = CFG.ink;
  g.font = `700 132px ${SANS}`;
  g.textBaseline = 'alphabetic';
  CFG.title.forEach((line, li) => {
    const y = 540 + li * 168;
    g.save();
    g.globalAlpha = 1;
    const start = 0.55 + li * 0.22;
    drawText(g, line, LX, y, (i) => outExpo(clamp((T - start - i * 0.055) / 0.55, 0, 1)));
    g.restore();
  });
  g.restore();

  /* 强调色短线：扫过 */
  const ruleP = smooth(win(T, 1.45, 2.05));
  if (ruleP > 0) {
    g.fillStyle = CFG.accent;
    g.fillRect(LX, 540 + (CFG.title.length - 1) * 168 + 62, lerp(0, 210, ruleP), 6);
  }

  /* 副标题 */
  const subP = outExpo(win(T, 1.70, 2.35));
  if (subP > 0) {
    g.save();
    g.globalAlpha = subP * 0.86;
    g.fillStyle = CFG.ink;
    g.font = `400 34px ${SANS}`;
    g.fillText(CFG.sub, LX + (1 - subP) * 18, 868);
    g.restore();
  }

  /* 右下角标签 */
  const tagP = smooth(win(T, 2.25, 2.85));
  if (tagP > 0) {
    g.save();
    g.globalAlpha = tagP * 0.5;
    g.fillStyle = CFG.ink;
    g.font = `400 24px ${MONO}`;
    g.textAlign = 'right';
    g.fillText(CFG.tag, W - 140, H - 190);
    g.restore();
  }
}

/* ---------- 渲染契约：这段不要改 ---------- */
function renderAt(t) { drawFrame(clamp(t, 0, DUR - 0.001)); }
window.__seek = renderAt;
window.__ready = true;
if (window.__seekRender) {
  renderAt(0);                       // 冻结时钟：完全由外部 __seek 推帧
} else {
  let cur = 0, last = null;          // 浏览器预览：自驱循环（点击暂停）
  let playing = true;
  const tick = now => {
    if (last === null) last = now;
    if (playing) cur = (cur + Math.min(0.05, (now - last) / 1000)) % DUR;
    last = now; renderAt(cur); requestAnimationFrame(tick);
  };
  document.addEventListener('click', () => { playing = !playing; });
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
