name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 不要用 ubuntu-latest：2026 年它已指向 26.04，而 Playwright 1.5x 的
    # `install --with-deps` 只认到 24.04，会直接报
    # "Playwright does not support chromium on ubuntu26.04-x64" 整条流水线挂掉。
    # 钉版本号，跑得动比「最新」重要。
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 渲染管线要一个完整版 ffmpeg（Playwright 自带的是裁剪版，编不了 h264）
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check ffmpeg
        run: ffmpeg -hide_banner -encoders | grep -q libx264

      - name: Run tests
        run: npm test
